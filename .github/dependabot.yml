version: 2
updates:
  # Keep GitHub Actions pinned versions fresh
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Client (React/Vite) — group minor+patch into one monthly PR to keep noise low
  - package-ecosystem: npm
    directory: "/client/lingua-read-client"
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Backend (.NET) — solution at repo root covers API + Tests projects
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile base images (compose's postgres:18 is a deliberate major pin;
  # minor releases arrive via `docker compose pull db` during deploys)
  - package-ecosystem: docker
    directory: "/server/LinguaReadApi"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/client/lingua-read-client"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/backup"
    schedule:
      interval: monthly
