version: 2
updates:
  # All update PRs go to dev: staging tests them, and main stays whatever production runs
  # (a PR merged straight into main would skip staging and break promote-prod's fast-forward).
  # Keep GitHub Actions pinned versions fresh
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Client (React/Vite) — group minor+patch into one monthly PR to keep noise low
  - package-ecosystem: npm
    directory: "/client/lingua-read-client"
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Backend (.NET) — solution at repo root covers API + Tests projects
  - package-ecosystem: nuget
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Images pinned in docker-compose*.yml: postgres, and the monitoring stack in the prod file.
  # Postgres majors are ignored: they need a dump/restore migration, not a tag bump.
  # The Beszel hub and agent versions must match, so they arrive in one PR.
  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Our own images: the tag is set per deploy, the compose default is only a fallback
      - dependency-name: "*lingua-read-*"
    groups:
      beszel:
        patterns: ["henrygd/beszel*"]

  # Dockerfile base images
  - package-ecosystem: docker
    directory: "/server/LinguaReadApi"
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/client/lingua-read-client"
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/backup"
    target-branch: dev
    schedule:
      interval: monthly
