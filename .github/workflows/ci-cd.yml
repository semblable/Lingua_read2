name: CI/CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/lingua-read-api
  IMAGE_NGINX: ${{ github.repository_owner }}/lingua-read-nginx

jobs:
  ci_dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Lingua_Read.sln

      - name: Build
        run: dotnet build Lingua_Read.sln -c Release --no-restore

      - name: Test
        run: dotnet test Lingua_Read.sln -c Release --no-build

  ci_client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/lingua-read-client/package-lock.json

      - name: Install client deps
        run: npm ci --legacy-peer-deps
        working-directory: client/lingua-read-client

      - name: Test client
        run: npm test -- --watchAll=false
        working-directory: client/lingua-read-client
        env:
          CI: true

  build_api:
    runs-on: ubuntu-latest
    needs: [ ci_dotnet ]
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute API image tag
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build & push (api)
        uses: docker/build-push-action@v6
        with:
          context: ./server/LinguaReadApi
          file: ./server/LinguaReadApi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_nginx:
    runs-on: ubuntu-latest
    needs: [ ci_client ]
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Nginx image tag
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (nginx)
        id: meta_nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build & push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./client/lingua-read-client
          file: ./client/lingua-read-client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:latest
          labels: ${{ steps.meta_nginx.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [ build_api, build_nginx ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose and config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,client/lingua-read-client/nginx.ssl.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Write production environment to .env (kept in GitHub Secrets as multiline text).
            # Create a secret named PRODUCTION_ENV containing the full .env contents.
            cat > .env <<'EOF'
            ${{ secrets.PRODUCTION_ENV }}
            EOF
            cat >> .env <<'EOF'
            API_IMAGE_TAG=${{ needs.build_api.outputs.image_tag }}
            NGINX_IMAGE_TAG=${{ needs.build_nginx.outputs.image_tag }}
            EOF
            chmod 600 .env
            LOGIN_SECRET=$(grep '^LOGIN_SECRET=' .env | head -n1 | cut -d= -f2- || true)

            # Ensure TLS certs exist for the production Nginx config.
            # If you haven't provisioned real certs yet, generate a temporary self-signed pair.
            mkdir -p certs
            if [ ! -s certs/fullchain.pem ] || [ ! -s certs/privkey.pem ]; then
              echo "TLS certs missing at ./certs; generating self-signed certs (temporary)"
              if ! command -v openssl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y openssl
              fi
              openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout certs/privkey.pem \
                -out certs/fullchain.pem \
                -subj "/CN=${HOSTNAME:-localhost}"
              chmod 600 certs/privkey.pem certs/fullchain.pem
            fi

            # Use sudo because many hosts restrict /var/run/docker.sock to root/docker group.
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api nginx
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate api

            # Health check (inside the api container; Nginx is Basic-Auth protected).
            # The API may take time to start (DB readiness + migrations). Retry and dump logs on failure.
            ok=""
            for i in $(seq 1 60); do
              if sudo docker compose exec -T api curl -fsS http://localhost:5000/api/Health >/dev/null; then
                ok="yes"
                break
              fi
              echo "Waiting for API health... ($i/60)"
              sleep 2
            done

            if [ "$ok" = "yes" ]; then
              echo "Health check OK"
            else
              echo "Health check FAILED; dumping status/logs"
              sudo docker compose ps
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi

            echo "Running authenticated smoke test against /api/usersettings"
            if [ -n "${LOGIN_SECRET}" ]; then
              set +e
              login_result=$(
                sudo docker compose exec -T -e LOGIN_SECRET="$LOGIN_SECRET" api sh -lc '
                  curl -sS -X POST http://localhost:5000/api/auth/login \
                    -H "Accept: application/json" \
                    -H "X-Login-Secret: $LOGIN_SECRET" \
                    -w "\n%{http_code}"
                '
              )
              login_exec_status=$?
              set -e
            else
              set +e
              login_result=$(
                sudo docker compose exec -T api sh -lc '
                  curl -sS -X POST http://localhost:5000/api/auth/login \
                    -H "Accept: application/json" \
                    -H "X-Forwarded-User: deploy-smoke-test" \
                    -w "\n%{http_code}"
                '
              )
              login_exec_status=$?
              set -e
            fi

            if [ "$login_exec_status" -ne 0 ]; then
              echo "Smoke-test login command failed with exit code $login_exec_status"
              printf '%s\n' "$login_result"
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi

            login_http_code=$(printf '%s\n' "$login_result" | tail -n1)
            login_response=$(printf '%s\n' "$login_result" | sed '$d')
            if [ "$login_http_code" != "200" ]; then
              echo "Smoke-test login failed with HTTP $login_http_code"
              printf '%s\n' "$login_response"
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi

            token=$(printf '%s' "$login_response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if [ -z "$token" ]; then
              echo "Failed to obtain auth token during smoke test"
              printf '%s\n' "$login_response"
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi

            set +e
            usersettings_result=$(
              sudo docker compose exec -T -e AUTH_TOKEN="$token" api sh -lc '
                curl -sS http://localhost:5000/api/usersettings \
                  -H "Accept: application/json" \
                  -H "Authorization: Bearer $AUTH_TOKEN" \
                  -w "\n%{http_code}"
              '
            )
            usersettings_exec_status=$?
            set -e
            if [ "$usersettings_exec_status" -ne 0 ]; then
              echo "Usersettings smoke-test command failed with exit code $usersettings_exec_status"
              printf '%s\n' "$usersettings_result"
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi
            usersettings_http_code=$(printf '%s\n' "$usersettings_result" | tail -n1)
            usersettings_response=$(printf '%s\n' "$usersettings_result" | sed '$d')
            if [ "$usersettings_http_code" != "200" ]; then
              echo "Usersettings smoke test failed with HTTP $usersettings_http_code"
              printf '%s\n' "$usersettings_response"
              sudo docker compose logs --no-color --tail=200 api || true
              exit 1
            fi
            echo "Usersettings smoke test OK"

            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate nginx

