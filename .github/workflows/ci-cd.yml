name: CI/CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/lingua-read-api
  IMAGE_NGINX: ${{ github.repository_owner }}/lingua-read-nginx

jobs:
  ci_dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Lingua_Read.sln

      - name: Build
        run: dotnet build Lingua_Read.sln -c Release --no-restore

      - name: Test
        run: dotnet test Lingua_Read.sln -c Release --no-build

  ci_client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/lingua-read-client/package-lock.json

      - name: Install client deps
        run: npm ci --legacy-peer-deps
        working-directory: client/lingua-read-client

      - name: Test client
        run: npm test -- --watchAll=false
        working-directory: client/lingua-read-client
        env:
          CI: true

  build_api:
    runs-on: ubuntu-latest
    needs: [ ci_dotnet ]
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute API image tag
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build & push (api)
        uses: docker/build-push-action@v6
        with:
          context: ./server/LinguaReadApi
          file: ./server/LinguaReadApi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_nginx:
    runs-on: ubuntu-latest
    needs: [ ci_client ]
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Nginx image tag
        id: image_tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (nginx)
        id: meta_nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build & push (nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./client/lingua-read-client
          file: ./client/lingua-read-client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:${{ steps.image_tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:latest
          labels: ${{ steps.meta_nginx.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NGINX }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [ build_api, build_nginx ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose and config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,client/lingua-read-client/nginx.ssl.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Always use the same compose files (matches pull/up) for ps/logs during failures.
            dc() {
              sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            # Write production environment to .env (kept in GitHub Secrets as multiline text).
            # Create a secret named PRODUCTION_ENV containing the full .env contents.
            cat > .env <<'EOF'
            ${{ secrets.PRODUCTION_ENV }}
            EOF
            cat >> .env <<'EOF'
            API_IMAGE_TAG=${{ needs.build_api.outputs.image_tag }}
            NGINX_IMAGE_TAG=${{ needs.build_nginx.outputs.image_tag }}
            EOF
            chmod 600 .env

            # Ensure TLS certs exist for the production Nginx config.
            # If you haven't provisioned real certs yet, generate a temporary self-signed pair.
            mkdir -p certs
            if [ ! -s certs/fullchain.pem ] || [ ! -s certs/privkey.pem ]; then
              echo "TLS certs missing at ./certs; generating self-signed certs (temporary)"
              if ! command -v openssl >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y openssl
              fi
              openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout certs/privkey.pem \
                -out certs/fullchain.pem \
                -subj "/CN=${HOSTNAME:-localhost}"
              chmod 600 certs/privkey.pem certs/fullchain.pem
            fi

            # Use sudo because many hosts restrict /var/run/docker.sock to root/docker group.
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            dc pull api nginx
            dc up -d --force-recreate api
            api_container_id=$(dc ps -q api)
            if [ -z "$api_container_id" ]; then
              echo "Could not resolve api container id after recreate"
              dc ps
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            # Readiness: DB connectivity + seeded default user (see GET /api/Health/ready).
            # Nginx is Basic-Auth protected; smoke tests call Kestrel inside the api container.
            ok=""
            for i in $(seq 1 60); do
              if sudo docker exec "$api_container_id" curl -fsS http://localhost:5000/api/Health/ready >/dev/null; then
                ok="yes"
                break
              fi
              echo "Waiting for API readiness (GET /api/Health/ready)... ($i/60)"
              sleep 2
            done

            if [ "$ok" = "yes" ]; then
              echo "Readiness check OK (database + default user)"
            else
              echo "Readiness check FAILED (expected HTTP 200 from /api/Health/ready); dumping status/logs"
              dc ps
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            # Read the login secret from the running container so the smoke test uses
            # the exact value the API is validating, regardless of .env quoting rules.
            set +e
            CONTAINER_LOGIN_SECRET=$(sudo docker exec "$api_container_id" sh -lc 'printf "%s" "${Auth__LoginSecret:-}"' | tr -d '\r')
            container_login_secret_status=$?
            set -e
            if [ "$container_login_secret_status" -ne 0 ]; then
              echo "Failed to read Auth__LoginSecret from the running api container"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            echo ">>> Smoke test: begin (stdout+stderr)" >&2
            echo ">>> Smoke test: begin"

            if [ -n "${CONTAINER_LOGIN_SECRET}" ]; then
              echo "Smoke test login mode: X-Login-Secret (Auth__LoginSecret is set in the container)"
            else
              echo "Smoke test login mode: X-Forwarded-User (Auth__LoginSecret empty in the container)"
            fi
            echo "Running authenticated smoke test: POST /api/auth/login then GET /api/usersettings"
            login_output_file=$(mktemp)
            if [ -n "${CONTAINER_LOGIN_SECRET}" ]; then
              set +e
              sudo docker exec -e LOGIN_SECRET="$CONTAINER_LOGIN_SECRET" "$api_container_id" sh -lc '
                curl -sS -X POST http://localhost:5000/api/auth/login \
                  -H "Accept: application/json" \
                  -H "X-Login-Secret: $LOGIN_SECRET" \
                  -w "\n%{http_code}"
              ' >"$login_output_file" 2>&1
              login_exec_status=$?
              set -e
            else
              set +e
              sudo docker exec "$api_container_id" sh -lc '
                curl -sS -X POST http://localhost:5000/api/auth/login \
                  -H "Accept: application/json" \
                  -H "X-Forwarded-User: deploy-smoke-test" \
                  -w "\n%{http_code}"
              ' >"$login_output_file" 2>&1
              login_exec_status=$?
              set -e
            fi
            login_result=$(cat "$login_output_file")
            rm -f "$login_output_file"

            if [ "$login_exec_status" -ne 0 ]; then
              echo "Smoke-test login: curl transport error (exit $login_exec_status). Body/stderr:"
              printf '%s\n' "$login_result"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            # Pipelines in $() can exit non-zero under pipefail; do not let that abort the script before diagnostics.
            set +e
            login_http_code=$(printf '%s\n' "$login_result" | tail -n1)
            login_response=$(printf '%s\n' "$login_result" | sed '$d')
            set -e
            if [ "$login_http_code" != "200" ]; then
              echo "Smoke-test login failed with HTTP $login_http_code (expected 200). Response body:"
              printf '%s\n' "$login_response"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            set +e
            token=""
            if command -v python3 >/dev/null 2>&1 && [ -n "$login_response" ]; then
              token=$(printf '%s' "$login_response" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('token') or d.get('Token'); print(t if t is not None else '')" 2>/dev/null)
            fi
            if [ -z "$token" ]; then
              token=$(printf '%s' "$login_response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            fi
            set -e
            if [ -z "$token" ]; then
              echo "Failed to parse JWT from login response (expected JSON with token field)"
              printf '%s\n' "$login_response"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi

            usersettings_output_file=$(mktemp)
            set +e
            sudo docker exec -e AUTH_TOKEN="$token" "$api_container_id" sh -lc '
              curl -sS http://localhost:5000/api/usersettings \
                -H "Accept: application/json" \
                -H "Authorization: Bearer $AUTH_TOKEN" \
                -w "\n%{http_code}"
            ' >"$usersettings_output_file" 2>&1
            usersettings_exec_status=$?
            set -e
            usersettings_result=$(cat "$usersettings_output_file")
            rm -f "$usersettings_output_file"
            if [ "$usersettings_exec_status" -ne 0 ]; then
              echo "GET /api/usersettings: curl transport error (exit $usersettings_exec_status). Body/stderr:"
              printf '%s\n' "$usersettings_result"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi
            set +e
            usersettings_http_code=$(printf '%s\n' "$usersettings_result" | tail -n1)
            usersettings_response=$(printf '%s\n' "$usersettings_result" | sed '$d')
            set -e
            if [ "$usersettings_http_code" != "200" ]; then
              echo "GET /api/usersettings failed with HTTP $usersettings_http_code (expected 200). Response body:"
              printf '%s\n' "$usersettings_response"
              dc logs --no-color --tail=200 api || true
              exit 1
            fi
            echo "Usersettings smoke test OK"

            dc up -d --force-recreate nginx

