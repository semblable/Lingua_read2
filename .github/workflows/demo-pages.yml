name: Publish static demo to GitHub Pages

# Deliberately opt-in. Shipping a reader change does not publish the showcase.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/lingua-read-client/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client/lingua-read-client
      - name: Test demo isolation and data
        run: npm run demo:test
        working-directory: client/lingua-read-client
      - name: Build static showcase
        run: npm run demo:build
        working-directory: client/lingua-read-client
        env:
          DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload static demo only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: client/lingua-read-client/demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
