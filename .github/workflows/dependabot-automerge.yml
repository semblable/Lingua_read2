name: Dependabot Auto-Merge

# Automatically approves and enables auto-merge for Dependabot patch and security updates.
# If a security alert PR targets `main`, it is retargeted to `dev` so it goes through Staging first.
# The PR is only merged into `dev` AFTER all CI checks in pr.yml pass 100%.
# When the PR merges, staging.yml is triggered to deploy the verified dependency to staging.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  automerge:
    name: Enable auto-merge for Dependabot
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Retarget to dev if needed
        if: github.base_ref != 'dev'
        run: |
          echo "Dependabot PR opened against ${{ github.base_ref }}; retargeting to dev so it deploys to staging first."
          gh pr edit "$PR_URL" --base dev
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge (patch & security)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || contains(github.event.pull_request.labels.*.name, 'security')
        run: |
          gh pr review --approve "$PR_URL" || echo "Notice: Review approval skipped or already submitted."
          gh pr merge --auto --squash "$PR_URL" || echo "Notice: Auto-merge already enabled or not permitted."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

  trigger-staging:
    name: Trigger Staging Deploy on Merge
    runs-on: ubuntu-latest
    # When auto-merged via GITHUB_TOKEN, GitHub Actions prevents recursive `on: push` events.
    # This job explicitly dispatches staging.yml upon successful merge of a Dependabot PR into dev.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dispatch staging workflow
        run: |
          if [ -n "$HAS_CUSTOM_TOKEN" ]; then
            echo "Custom token configured; push event already dispatched staging automatically."
          else
            echo "Dependabot PR #${{ github.event.pull_request.number }} merged into dev. Triggering staging deployment..."
            gh workflow run staging.yml --ref dev
          fi
        env:
          HAS_CUSTOM_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
