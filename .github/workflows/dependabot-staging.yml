name: Dependabot Staging

# GITHUB_TOKEN merges suppress push AND pull_request.closed. CI completion is
# independent of that merge event; the hourly check covers a delayed auto-merge.
on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Retry a previously unsuccessful staging run for the current bot merge"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  observe:
    name: Observe protected Dependabot merge
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      ready: ${{ steps.observe.outputs.ready }}
    steps:
      # Never check out the triggering PR or consume its artifacts. A workflow_run
      # has elevated permissions even when the triggering PR is untrusted.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Observe the exact validated head
        id: observe
        run: node .github/scripts/dependabot-staging.mjs observe
        env:
          GH_TOKEN: ${{ github.token }}

  reconcile:
    name: Reconcile missing staging
    needs: observe
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && ((github.event_name == 'workflow_run' && needs.observe.outputs.ready == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
      actions: write
    # Only dispatch is serialized. Replaced pending jobs are harmless because the
    # next job reads current dev, and hourly reconciliation covers late merges.
    concurrency:
      group: dependabot-staging-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Dispatch staging only for a verified missing bot merge
        run: node .github/scripts/dependabot-staging.mjs reconcile
        env:
          GH_TOKEN: ${{ github.token }}
