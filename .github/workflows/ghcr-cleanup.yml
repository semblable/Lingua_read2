name: GHCR Cleanup

# Monthly retention for GHCR image versions: keeps the newest 30 tagged
# versions per package plus everything tagged latest/prod/buildcache, and
# removes untagged manifests. Run manually with dry_run=true first to preview.

on:
  schedule:
    - cron: "0 5 1 * *"   # 1st of the month, 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no deletions)"
        type: boolean
        default: false

# GHCR's package-delete API is rate-limited to roughly 1 req/sec, and a large
# backlog (thousands of versions across 3 packages) can take well over an
# hour to clear; queue instead of racing a second trigger against the first.
concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Deletes are one-by-one at ~1 req/sec against GHCR's rate limit; a large
    # backlog needs well over the previous 15m to fully clear in one run.
    timeout-minutes: 90
    steps:
      - name: Clean up old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: lingua-read-api,lingua-read-nginx,lingua-read-backup
          exclude-tags: latest,prod,buildcache
          keep-n-tagged: 30
          delete-untagged: true
          dry-run: ${{ inputs.dry_run || false }}
          validate: true
