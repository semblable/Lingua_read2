name: Notify Workflow Failure

# Pings ALERT_WEBHOOK_URL (POST {"content": "..."}) whenever a deployment or
# scheduled maintenance workflow fails or times out.

on:
  workflow_run:
    workflows:
      - "Staging"
      - "Promote to Production"
      - "Security Scan"
      - "GHCR Cleanup"
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    name: Send failure webhook
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send webhook alert
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK_URL" ] || exit 0
          short_sha="${SHA:0:7}"
          payload=$(jq -n \
            --arg content "❌ GitHub Actions **${WORKFLOW_NAME}** (${CONCLUSION}) on \`${BRANCH}\` (\`${short_sha}\`): ${RUN_URL}" \
            '{content: $content}')
          curl -fsS -m 10 --retry 3 -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
