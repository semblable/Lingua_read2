name: PR Validation

# Runs the full CI + docker-build pipeline on every pull request, without
# pushing any images. This is the required-checks gate for branch protection.

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches: [ dev, main ]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: CI
    # Run on open/synchronize/reopen, or if an edit changed the target base branch (e.g. retargeted from main to dev)
    if: github.event.action != 'edited' || github.event.changes.base != null
    uses: ./.github/workflows/_ci-build.yml
    with:
      push_images: false
