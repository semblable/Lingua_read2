name: Security Scan

# Weekly Trivy scan of the images production runs (:prod). Deliberately not a
# PR/build gate — a red run means a fixable CRITICAL CVE shipped in a base
# image; GitHub emails on failure. Goes green after the first promotion
# publishes :prod tags.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [ lingua-read-api, lingua-read-nginx, lingua-read-backup ]
    steps:
      - name: Scan ${{ matrix.image }}:prod
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:prod
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 15m
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
