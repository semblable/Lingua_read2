worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml image/svg+xml font/ttf font/otf
               application/font-woff application/font-woff2;

    # Increase client body size for large uploads (match backend limits)
    client_max_body_size 5000M;

    upstream backend_api {
        server api:5000;
    }

    # Block known-bad user agents (scanners, exploit tools)
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?:sqlmap|nikto|havij|nmap|masscan|zgrab|semrush|ahrefs) 1;
    }

    server {
        listen 80;

        # Serve static files
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ── Security headers ──────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Security: block path traversal and malformed requests ─
        if ($request_uri ~* "(\.\./|\.\.%2[fF]|%2[eE]%2[eE]|%00)") {
            return 400;
        }

        # Block known-bad bots
        if ($bad_bot) {
            return 403;
        }

        # Cache hashed static assets aggressively (CRA adds content hashes)
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Cache other static files with moderate duration
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ── Security: block sensitive file/directory patterns ─────
        # Dotfiles: .env, .git, .aws, .docker, etc.
        location ~ /\. {
            return 404;
        }

        # Configuration/source files that should never be served
        location ~* \.(py|yaml|yml|toml|ini|conf|cfg|bak|sql|log|sh|bash)$ {
            return 404;
        }

        # WordPress, PHP, CGI, and common exploit paths
        location ~* ^/(wp-|wordpress|cgi-bin|admin\.php|xmlrpc\.php|phpinfo|phpmyadmin) {
            return 404;
        }

        # Handle client-side routing by redirecting all non-file requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Increase timeouts for large uploads (audiobooks up to 5GB) and long-running API calls
            proxy_connect_timeout 300s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }

        # Proxy audio lesson static files to backend.
        # No auth here: the browser <audio> element cannot send cookies for cross-origin range requests.
        # Streaming: disable proxy buffering so Range requests (byte-range seeks)
        # pass through immediately instead of nginx downloading the full file first.
        location ^~ /audio_lessons/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Proxy audiobook static files to backend
        location ^~ /audiobooks/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Proxy EPUB extracted images to backend.
        location ^~ /epub_assets/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
