worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Increase client body size for large uploads (match backend limits)
    client_max_body_size 5000M;

    upstream backend_api {
        server api:5000;
    }

    server {
        listen 80;

        # Serve static files
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Allow source maps without auth to avoid DevTools 401 noise.
        location ~* \.map$ {
            auth_basic off;
        }

        # Handle client-side routing by redirecting all non-file requests to index.html
        location / {
            auth_basic "Restricted Content";
            auth_basic_user_file /etc/nginx/.htpasswd; # Path inside the container
            try_files $uri $uri/ /index.html;
        }

        # Protect ONLY the auto-login endpoint with Basic Auth.
        # Other API routes use Bearer JWT in the Authorization header, which conflicts with Basic Auth.
        location = /api/auth/login {
            auth_basic "Restricted Content";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-User $remote_user;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-User $remote_user;
            proxy_cache_bypass $http_upgrade;

            # Increase timeouts for potentially long-running API calls (e.g., translation)
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Proxy audio lesson static files to backend.
        # No Basic Auth here: the browser <audio> element cannot send JWT; auth on this path caused 401/HTML responses and decode errors.
        # Streaming: disable proxy buffering so Range requests (byte-range seeks)
        # pass through immediately instead of nginx downloading the full file first.
        location /audio_lessons/ {
            auth_basic off;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-User $remote_user;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Proxy audiobook static files to backend
        location /audiobooks/ {
            auth_basic "Restricted Content";
            auth_basic_user_file /etc/nginx/.htpasswd; # Path inside the container

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-User $remote_user;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Proxy EPUB extracted images to backend.
        # Keep this unauthenticated like lesson audio so browser media requests
        # don't get trapped by the generic SPA location and Basic Auth prompt.
        location /epub_assets/ {
            auth_basic off;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-User $remote_user;
            proxy_cache_bypass $http_upgrade;
        }
    }
}