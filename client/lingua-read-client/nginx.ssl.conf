worker_processes auto;

# Unprivileged nginx (uid 101) can only write under /tmp.
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Writable temp locations for the unprivileged nginx user.
    # Note: large upload bodies (up to 5GB) now spool under /tmp in-container.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Enable gzip compression
    gzip on;
    # Serve pre-compressed .gz files generated at image build time (see Dockerfile)
    # instead of re-compressing hashed static assets on every request.
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml image/svg+xml font/ttf font/otf
               application/font-woff application/font-woff2;

    # Increase client body size for large uploads (match backend limits)
    client_max_body_size 5000M;

    upstream backend_api {
        server api:5000;
    }

    # Block known-bad user agents (scanners, exploit tools)
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?:sqlmap|nikto|havij|nmap|masscan|zgrab|semrush|ahrefs) 1;
    }

    # HTTP: redirect everything to HTTPS (host-agnostic so the same config
    # works for any domain pointed at this server). The redirect is location-
    # scoped (not a server-level return) so /healthz stays reachable over HTTP
    # for container healthchecks.
    server {
        listen 8080;
        server_name _;

        # Container/uptime health probe (no auth, no logging)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name _;

        # Container/uptime health probe (no auth, no logging)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Certificates must be provided via volume mount to /etc/nginx/certs
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Serve static files
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ── Security headers ──────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Security: block path traversal and malformed requests ─
        if ($request_uri ~* "(\.\./|\.\.%2[fF]|%2[eE]%2[eE]|%00)") {
            return 400;
        }

        # Block known-bad bots
        if ($bad_bot) {
            return 403;
        }

        # Cache hashed static assets aggressively (CRA adds content hashes)
        location /static/ {
            try_files $uri =404;
            log_not_found off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Cache other static files with moderate duration
        location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            log_not_found off;
            expires 30d;
            add_header Cache-Control "public";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ── Security: block sensitive file/directory patterns ─────
        # Linux pseudo-filesystem probes, including /static//proc/1/environ.
        location ~* (^|/)(?:proc|sys|dev|run)(?:/|$) {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Dotfiles: .env, .git, .aws, .docker, etc.
        location ~ /\. {
            log_not_found off;
            return 404;
        }

        # Configuration/source files that should never be served
        location ~* \.(py|yaml|yml|toml|ini|conf|cfg|bak|sql|log|sh|bash)$ {
            log_not_found off;
            return 404;
        }

        # WordPress, PHP, CGI, and common exploit paths
        location ~* ^/(wp-|wordpress|cgi-bin|admin\.php|xmlrpc\.php|phpinfo|phpmyadmin) {
            log_not_found off;
            return 404;
        }

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 300s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }

        # Media proxies: lesson audio must be streamable.
        # Streaming: disable proxy buffering so Range requests (byte-range seeks)
        # pass through immediately instead of nginx downloading the full file first.
        location ^~ /audio_lessons/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        location ^~ /audiobooks/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_force_ranges on;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Proxy EPUB extracted images to backend.
        location ^~ /epub_assets/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
