services:
  api:
    deploy:
      resources:
        limits:
          # Sized for a ~4GB VPS; adjust to your host's RAM.
          memory: 1500M

  nginx:
    ports:
      # nginx-unprivileged listens on 8080/8443 internally; external ports stay 80/443.
      - "80:8080"
      - "443:8443"
    volumes:
      # SSL certificates (place `fullchain.pem` + `privkey.pem` here on the host).
      # Must be readable by uid 101 (the unprivileged nginx user): chown -R 101:101 certs
      - ./certs:/etc/nginx/certs:ro
      # Use the SSL-enabled Nginx config for production
      - ./client/lingua-read-client/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M

  backup:
    deploy:
      resources:
        limits:
          memory: 256M

  # db intentionally has no memory limit: OOM-killing Postgres is worse than
  # letting it self-regulate around its shared_buffers defaults.
