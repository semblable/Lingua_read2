services:
  db:
    # Pinned minor (not floating `postgres:18`) so a deploy's `pull` can't move the
    # database version underneath us and rollbacks are reproducible. Dependabot's
    # docker-compose ecosystem proposes minor bumps (majors need a dump/restore).
    image: postgres:18.6
    # Postgres ships defaults sized for tiny machines (shared_buffers=128MB).
    # Tune for the ~4GB VPS this stack targets, leaving room for the api (1.5G
    # limit), nginx/backup (256M each), and the OS. effective_cache_size is a
    # planner hint, not an allocation. Other hosts override both (roughly 25% and
    # 50% of RAM) with the POSTGRES_* variables of their GitHub environment.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ghcr.io/semblable/lingua-read-api:${API_IMAGE_TAG:-latest}
    build: ./server/LinguaReadApi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # For ASP.NET Core Connection String
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;Minimum Pool Size=2;Maximum Pool Size=20;Connection Idle Lifetime=300
      # For pg_dump/pg_restore in DatabaseAdminService
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Other variables
      Jwt__Key: ${JWT_KEY}
      # Issuer/audience are opaque labels matched against themselves, not the site's domain,
      # so a domain move never requires changing them. Override only to rotate every session.
      Jwt__Issuer: ${JWT_ISSUER:-LinguaReadApi}
      Jwt__Audience: ${JWT_AUDIENCE:-LinguaReadClient}
      Jwt__ExpiryInHours: ${JWT_EXPIRY_HOURS:-2160}
      DeepL__ApiKey: ${DEEPL_API_KEY}
      Gemini__ApiKey: ${GEMINI_API_KEY}
      # Optional: Wikimedia OAuth 2.0 access token. Authenticates Wiktionary word lookups to
      # raise the rate limit from <5 req/s (anonymous) to 10 req/s. Leave unset to stay anonymous.
      Wiktionary__AccessToken: ${WIKTIONARY_ACCESS_TOKEN:-}
      # Optional: server-level fallback credentials for the Azure Translator / Google Translate
      # word providers. Per-user keys set in Settings take precedence; leave unset to require them.
      Azure__Translator__Key: ${AZURE_TRANSLATOR_KEY:-}
      Azure__Translator__Region: ${AZURE_TRANSLATOR_REGION:-}
      Google__Translate__ApiKey: ${GOOGLE_TRANSLATE_API_KEY:-}
      Auth__InitialPassword: ${LINGUAREAD_PASSWORD:-}
      # Blank by default: the SPA is same-origin behind nginx; only cross-origin callers need entries.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Discord__WeeklyReportDayOfWeek: ${DISCORD_WEEKLY_REPORT_DAY:-Monday}
      Discord__WeeklyReportHourUtc: ${DISCORD_WEEKLY_REPORT_HOUR_UTC:-8}
      Discord__DryRun: ${DISCORD_WEEKLY_REPORT_DRY_RUN:-false}
      Discord__PollIntervalMinutes: ${DISCORD_WEEKLY_REPORT_POLL_MINUTES:-30}
      # true = never write to outside accounts (Hardcover progress/ratings, Discord posts).
      # _deploy.yml sets it for staging, which runs on a copy of production's data.
      ExternalWrites__Disabled: ${EXTERNAL_WRITES_DISABLED:-false}
    volumes:
      - api_audio_lessons:/app/wwwroot/audio_lessons
      - api_audiobooks:/app/wwwroot/audiobooks
      - api_epub_assets:/app/wwwroot/epub_assets
      - api_hardcover_covers:/app/wwwroot/hardcover-covers
      - api_dp_keys:/app/keys
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/Health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  nginx:
    image: ghcr.io/semblable/lingua-read-nginx:${NGINX_IMAGE_TAG:-latest}
    build: ./client/lingua-read-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # nginx runs unprivileged (nginxinc/nginx-unprivileged) and listens on 8080 internally.
      - "80:8080"
    healthcheck:
      # busybox wget (alpine image has no curl); /healthz is served on the plain-HTTP port.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: ghcr.io/semblable/lingua-read-backup:${BACKUP_IMAGE_TAG:-latest}
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      # Selects the per-environment Drive folder; required by backup.sh (appended by _deploy.yml).
      - BACKUP_ENV
      # Optional healthchecks.io-style heartbeat URL pinged by backup.sh (empty = disabled).
      - HEALTHCHECK_URL
      # Staging only: 1 = refresh-from-prod.sh replaces staging's data with production's backup nightly.
      - REFRESH_FROM_PROD
    volumes:
      - backup_data:/backups
      - ./secrets/rclone.conf:/rclone/rclone.conf:ro
      # Media volumes, mirrored to Drive by backup.sh (the DB dump alone can't restore uploads).
      # Read-only everywhere except staging with REFRESH_FROM_PROD, which writes production's media
      # into them (_deploy.yml sets BACKUP_MEDIA_MOUNT=rw only there).
      - api_audio_lessons:/srv/media/audio_lessons:${BACKUP_MEDIA_MOUNT:-ro}
      - api_audiobooks:/srv/media/audiobooks:${BACKUP_MEDIA_MOUNT:-ro}
      - api_epub_assets:/srv/media/epub_assets:${BACKUP_MEDIA_MOUNT:-ro}
      - api_hardcover_covers:/srv/media/hardcover-covers:${BACKUP_MEDIA_MOUNT:-ro}
      # No api_dp_keys: those keys decrypt secrets in the DB dump and must not go to Drive with it.
      # :ro is hygiene only — socket access still grants full Docker API; used to read container logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  # Retired PostgreSQL 16 cluster — kept for rollback; prune once PG18 is confirmed stable.
  db_data:
  # PostgreSQL 18 data — mounted at /var/lib/postgresql to match the postgres:18 image VOLUME.
  db_data_pg18:
  api_audio_lessons:
  api_audiobooks:
  api_epub_assets:
  api_hardcover_covers:
  api_dp_keys:
  backup_data: